  <meta name="author" content="Yanal Al-hasan">
  <meta name="theme-color" content="#0f172a">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('portfolio-theme');
        var resolved = theme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', resolved);
        var accent = localStorage.getItem('portfolio-accent');
        if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
          document.documentElement.style.setProperty('--accent', accent.toLowerCase());
        }
        var bg = localStorage.getItem('portfolio-bg');
        if (bg && /^#[0-9a-fA-F]{6}$/.test(bg)) {
          document.documentElement.style.setProperty('--bg-color', bg.toLowerCase());
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', bg && /^#[0-9a-fA-F]{6}$/.test(bg) ? bg.toLowerCase() : resolved === 'light' ? '#eef1f5' : '#0f172a');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
