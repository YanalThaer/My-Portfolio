@if (transition.ready(data())) {
  @if (data(); as portfolio) {
  <section class="service" [class.active]="transition.contentActive()" aria-labelledby="services-heading">
    <h2 id="services-heading" class="heading">{{ i18n.t().whatIDoLead }} <span>{{ i18n.t().whatIDoSpan }}</span></h2>
    <div class="services-container">
      @for (service of portfolio.services; track service.title) {
        <article class="services-box">
          <div class="icon">
            <app-icon [name]="service.icon" />
            <a routerLink="/contact" [attr.aria-label]="i18n.t().contactAbout + ' ' + service.title">
              <app-icon name="arrow" />
            </a>
          </div>
          <h3>{{ service.title }}</h3>
          <p>{{ service.description }}</p>
        </article>
      }
    </div>
  </section>
  }
} @else {
  <app-page-skeleton page="work" />
}
